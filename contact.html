   <script>
    // Function to move all stars around randomly
    function moveStars() {
        const stars = document.querySelectorAll('.star');
        const maxX = window.innerWidth - 2000; // Star width
        const maxY = window.innerHeight - 1000; // Star height
        
        stars.forEach(star => {
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            star.style.left = `${x}px`;
            star.style.top = `${y}px`;
        });
    }

    // Function to update star color based on radio button selection
    function updateColor(event) {
        const color = event.target.value;
        const stars = document.querySelectorAll('.star');
        stars.forEach(star => {
            star.style.backgroundColor = color;
        });
    }

    // Event listener for radio buttons
    document.querySelectorAll('input[name="color"]').forEach(radio => {
        radio.addEventListener('change', updateColor);
    });

    // Move stars every 2 seconds
    setInterval(moveStars, 2000);
</script>
